name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default depth is 1 and only the workflow ref, so origin/main is missing and the
          # content baseline diff cannot run. Full history of every branch includes that ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Fetch origin/main for the content baseline
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify --quiet "origin/main^{commit}"
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
