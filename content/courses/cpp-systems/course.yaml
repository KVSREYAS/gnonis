id: cpp-systems
title: C++ for Systems & Performance
description: Intermediate C++ for systems and performance work, aimed at LLM inference.
  RAII and move semantics, ownership, templates and constexpr, memory layout, data-oriented
  design, undefined behaviour, the memory model, SIMD, profiling and the building
  blocks of an inference engine, ending with a forward pass in plain C++.
order: 3
cover: tower
prerequisites: []
tagline: From RAII to a forward pass.
level: intermediate
lessons:
- raii-scope-guards
- rule-of-zero-three-five
- lifetime-and-dangling
- boss-lifetime-lane
- value-categories
- move-and-noexcept
- perfect-forwarding
- boss-move-motel
- unique-ptr-and-deleters
- shared-ptr-control-block
- weak-ptr-and-cycles
- boss-pointer-projects
- classes-and-access
- constructors-and-destructors
- static-operators-and-friends
- inheritance-and-polymorphism
- boss-class-act-garage
- templates-and-deduction
- concepts-and-constraints
- constexpr-and-compile-time
- boss-template-town
- containers-and-invalidation
- algorithms-and-ranges
- views-span-and-string-view
- boss-stl-strip
- sizeof-padding-alignment
- cache-lines-and-locality
- aligned-allocation
- boss-layout-lofts
- aos-vs-soa
- hot-cold-splitting
- branches-and-predictability
- boss-dod-docks
- ub-catalogue
- aliasing-and-bit-cast
- sanitizers
- boss-ub-underground
- threads-and-jthread
- atomics-and-memory-order
- false-sharing
- boss-concurrency-casino
- auto-vectorization
- intrinsics-sse
- reductions-and-accumulators
- boss-simd-speedway
- benchmarking-pitfalls
- profilers-and-flamegraphs
- reading-assembly
- boss-perf-pier
- arena-allocator
