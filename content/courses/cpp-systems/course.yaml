districts:
- id: 01-lifetime
  title: Lifetime and RAII
  district: Lifetime Lane
  summary: Destructors run on every path out of scope. Make cleanup automatic, then
    never write delete again.
  tip: 'TIP: If you write a destructor, you probably need the other four. Or none.'
  art: skyline
  status: ready
  lessons:
  - raii-scope-guards
  - rule-of-zero-three-five
  - lifetime-and-dangling
  - boss-lifetime-lane
- id: 02-move
  title: Move semantics
  district: Move Motel
  summary: 'Value categories, std::move, noexcept, and perfect forwarding: stealing
    resources without getting caught.'
  tip: 'TIP: std::move doesn''t move. It casts.'
  art: docks
  status: ready
  lessons:
  - value-categories
  - move-and-noexcept
  - perfect-forwarding
  - boss-move-motel
- id: 03-ownership
  title: Smart-pointer ownership
  district: Pointer Projects
  summary: 'unique_ptr, shared_ptr and weak_ptr: who owns what, what it costs, and
    how cycles leak.'
  tip: 'TIP: Default to unique_ptr. Share only when ownership really is shared.'
  art: grid
  status: ready
  lessons:
  - unique-ptr-and-deleters
  - shared-ptr-control-block
  - weak-ptr-and-cycles
  - boss-pointer-projects
- id: oop
  title: Object-oriented programming
  district: Class Act Garage
  summary: Classes and access, constructors and destructors, static members, operators and friends, then inheritance and virtual functions.
  tip: 'TIP: Data private, methods public, destructors virtual in base classes.'
  art: docks
  status: ready
  lessons:
  - classes-and-access
  - constructors-and-destructors
  - static-operators-and-friends
  - inheritance-and-polymorphism
  - boss-class-act-garage
- id: 04-templates
  title: Templates and compile time
  district: Template Town
  summary: Deduction, concepts and constexpr. Make the compiler do the work and the
    error messages readable.
  tip: 'TIP: Constrain templates with concepts. Your future self reads the errors.'
  art: tower
  status: ready
  lessons:
  - templates-and-deduction
  - concepts-and-constraints
  - constexpr-and-compile-time
  - boss-template-town
- id: 05-stl
  title: Containers, algorithms and views
  district: STL Strip
  summary: Pick containers by access pattern, use algorithms and ranges, and pass
    span and string_view.
  tip: 'TIP: reserve() before a known-size push_back loop.'
  art: pier
  status: ready
  lessons:
  - containers-and-invalidation
  - algorithms-and-ranges
  - views-span-and-string-view
  - boss-stl-strip
- id: 06-layout
  title: Memory layout
  district: Layout Lofts
  summary: 'Padding, alignment and cache lines: where your bytes really live.'
  tip: 'TIP: Order members largest alignment first.'
  art: bridge
  status: ready
  lessons:
  - sizeof-padding-alignment
  - cache-lines-and-locality
  - aligned-allocation
  - boss-layout-lofts
- id: 07-dod
  title: Data-oriented design
  district: Data-Oriented Docks
  summary: AoS vs SoA, hot/cold splitting and branchless code. Design for the batch.
  tip: 'TIP: Where there is one, there are many.'
  art: docks
  status: ready
  lessons:
  - aos-vs-soa
  - hot-cold-splitting
  - branches-and-predictability
  - boss-dod-docks
- id: 08-ub
  title: Undefined behaviour
  district: UB Underground
  summary: The optimiser assumes UB never happens. Learn the catalogue, pun legally,
    and run sanitizers.
  tip: 'TIP: -fsanitize=address,undefined in every test build.'
  art: desert
  status: ready
  lessons:
  - ub-catalogue
  - aliasing-and-bit-cast
  - sanitizers
  - boss-ub-underground
- id: 09-concurrency
  title: Concurrency and the memory model
  district: Concurrency Casino
  summary: jthread, mutexes, atomics, acquire/release and false sharing.
  tip: 'TIP: Release publishes, acquire receives.'
  art: skyline
  status: ready
  lessons:
  - threads-and-jthread
  - atomics-and-memory-order
  - false-sharing
  - boss-concurrency-casino
- id: 10-simd
  title: SIMD
  district: SIMD Speedway
  summary: Auto-vectorisation, SSE intrinsics, and accumulators that hide latency.
  tip: 'TIP: Vector body, scalar tail.'
  art: hills
  status: ready
  lessons:
  - auto-vectorization
  - intrinsics-sse
  - reductions-and-accumulators
  - boss-simd-speedway
- id: 11-perf
  title: Profiling and benchmarking
  district: Perf Pier
  summary: Benchmarks that don't lie, perf and flame graphs, and reading the assembly.
  tip: 'TIP: Measure, explain, then optimise.'
  art: pier
  status: ready
  lessons:
  - benchmarking-pitfalls
  - profilers-and-flamegraphs
  - reading-assembly
  - boss-perf-pier
- id: 12-building-blocks
  title: Systems building blocks
  district: Builders' Yard
  summary: Arena allocators, a lock-free SPSC ring, a thread pool and object pools.
  tip: 'TIP: Bump-allocate per step, then reset.'
  art: grid
  status: ready
  lessons:
  - arena-allocator
  - spsc-ring-buffer
  - thread-pool
  - boss-builders-yard
- id: 13-capstone
  title: 'Capstone: inference in C++'
  district: The Inference Heist
  summary: Tensors and strides, tiled matmul, stable softmax and a full forward pass.
  tip: 'TIP: Decode is bandwidth-bound. Count the bytes.'
  art: tower
  status: ready
  lessons:
  - tensors-and-strides
  - tiled-matmul
  - softmax-and-sampling
  - boss-capstone-heist
