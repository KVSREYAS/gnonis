districts:
- id: oop
  title: Object-oriented programming
  district: Object-oriented programming
  summary: 'Milestone 1: entities. Slimes, the player and pickups as classes: access, constructors and
    destructors, static members and operators, stack vs heap, references and const, then inheritance and
    virtual functions for every kind of enemy.'
  tip: 'TIP: Data private, methods public, destructors virtual in base classes.'
  art: docks
  status: ready
  lessons:
  - oop-concepts
  - classes-and-access
  - constructors-and-destructors
  - static-operators-and-friends
  - stack-heap-and-pointers
  - references-and-const
  - inheritance-and-polymorphism
  - boss-class-act-garage
- id: 01-lifetime
  title: Lifetime and RAII
  district: Lifetime and RAII
  summary: 'Milestone 2: engine resources. Textures, sound handles and files that clean up after themselves
    on every path, dangling references, and exceptions that don''t leak.'
  tip: 'TIP: If you write a destructor, you probably need the other four. Or none of them.'
  art: skyline
  status: ready
  lessons:
  - lifetime-concepts
  - raii-scope-guards
  - rule-of-zero-three-five
  - lifetime-and-dangling
  - exceptions-and-error-handling
  - boss-lifetime-lane
- id: 02-move
  title: Move semantics
  district: Move semantics
  summary: 'Milestone 3: loading levels fast. Move tile maps and asset buffers instead of copying them:
    value categories, std::move, noexcept and perfect forwarding.'
  tip: 'TIP: std::move doesn''t move. It casts.'
  art: docks
  status: ready
  lessons:
  - move-concepts
  - value-categories
  - move-and-noexcept
  - perfect-forwarding
  - boss-move-motel
- id: 03-ownership
  title: Smart-pointer ownership
  district: Smart-pointer ownership
  summary: 'Milestone 4: the spawner and shared assets. Who owns each slime, each texture and each target
    lock: unique_ptr, shared_ptr, weak_ptr and the cycles that leak.'
  tip: 'TIP: Default to unique_ptr. Share only when ownership really is shared.'
  art: grid
  status: ready
  lessons:
  - ownership-concepts
  - unique-ptr-and-deleters
  - shared-ptr-control-block
  - weak-ptr-and-cycles
  - boss-pointer-projects
- id: 04-templates
  title: Templates and compile time
  district: Templates and compile time
  summary: 'Milestone 5: generic engine parts. One lerp, one area-of-effect query and one XP table for
    every type, with concepts for readable errors and constexpr for work done at compile time.'
  tip: 'TIP: Constrain templates with concepts. The error messages get much shorter.'
  art: tower
  status: ready
  lessons:
  - templates-concepts
  - templates-and-deduction
  - concepts-and-constraints
  - constexpr-and-compile-time
  - boss-template-town
- id: 05-stl
  title: Containers, algorithms and views
  district: Containers, algorithms and views
  summary: 'Milestone 6: entity lists, inventory and events. Containers and invalidation, algorithms,
    spans, lambdas as callbacks, optional and variant events, and hash maps for the spatial grid.'
  tip: 'TIP: reserve() before a known-size push_back loop.'
  art: pier
  status: ready
  lessons:
  - stl-concepts
  - containers-and-invalidation
  - algorithms-and-ranges
  - views-span-and-string-view
  - lambdas-and-callbacks
  - optional-and-variant
  - maps-and-hashing
  - boss-stl-strip
- id: 06-layout
  title: Memory layout
  district: Memory layout
  summary: 'Milestone 7: component layout. Where an enemy''s bytes really live: padding, alignment, cache
    lines and a flat tile map.'
  tip: 'TIP: Order members largest alignment first.'
  art: bridge
  status: ready
  lessons:
  - layout-concepts
  - sizeof-padding-alignment
  - cache-lines-and-locality
  - aligned-allocation
  - boss-layout-lofts
- id: 07-dod
  title: Data-oriented design
  district: Data-oriented design
  summary: 'Milestone 8: particles and ECS. Thousands of particles as arrays of fields, hot/cold splitting,
    predictable branches and an entity component system.'
  tip: 'TIP: Store fields that are processed together in their own arrays.'
  art: docks
  status: ready
  lessons:
  - dod-concepts
  - aos-vs-soa
  - hot-cold-splitting
  - branches-and-predictability
  - entity-component-system
  - boss-dod-docks
- id: 08-ub
  title: Undefined behaviour
  district: Undefined behaviour
  summary: 'Milestone 9: crash hunting in release. Bugs that only appear with optimisation on: the UB
    catalogue, aliasing and bit_cast for network packets, and sanitizers.'
  tip: 'TIP: -fsanitize=address,undefined in every test build.'
  art: desert
  status: ready
  lessons:
  - ub-concepts
  - ub-catalogue
  - aliasing-and-bit-cast
  - sanitizers
  - boss-ub-underground
- id: 09-concurrency
  title: Concurrency and the memory model
  district: Concurrency and the memory model
  summary: 'Milestone 10: the asset loading thread. Load the next level without freezing frames: jthread,
    atomics, mutexes and condition variables, and false sharing.'
  tip: 'TIP: Release publishes, acquire receives.'
  art: skyline
  status: ready
  lessons:
  - concurrency-concepts
  - threads-and-jthread
  - atomics-and-memory-order
  - false-sharing
  - mutexes-and-condition-variables
  - boss-concurrency-casino
- id: 10-simd
  title: SIMD
  district: SIMD
  summary: 'Milestone 11: particle physics for every explosion. Four particles per instruction: auto-vectorisation,
    SSE intrinsics with a tail loop, and accumulators for energy totals.'
  tip: 'TIP: Vector body, scalar tail.'
  art: hills
  status: ready
  lessons:
  - simd-concepts
  - auto-vectorization
  - intrinsics-sse
  - reductions-and-accumulators
  - boss-simd-speedway
- id: 11-perf
  title: Profiling and benchmarking
  district: Profiling and benchmarking
  summary: 'Milestone 12: a steady 60 FPS. Frame-time reports, benchmarks that don''t lie, zone timers
    and profilers, and reading the assembly of hot loops.'
  tip: 'TIP: Measure, explain, then optimise.'
  art: pier
  status: ready
  lessons:
  - perf-concepts
  - benchmarking-pitfalls
  - profilers-and-flamegraphs
  - reading-assembly
  - boss-perf-pier
- id: 12-building-blocks
  title: Systems building blocks
  district: Systems building blocks
  summary: 'Milestone 13: the engine core. A frame arena, a lock-free audio command queue, a job system
    for AI and a projectile pool.'
  tip: 'TIP: Bump-allocate per frame, then reset.'
  art: grid
  status: ready
  lessons:
  - building-blocks-concepts
  - arena-allocator
  - spsc-ring-buffer
  - thread-pool
  - boss-builders-yard
- id: 13-capstone
  title: 'Capstone: inference in C++'
  district: 'Capstone: inference in C++'
  summary: 'Milestone 14: the slime king''s brain. A tiny neural network picks the boss''s moves: tensors
    and strides, tiled matmul, stable softmax and sampling. The same pieces run a language model.'
  tip: 'TIP: Subtract the max before exp. Always.'
  art: tower
  status: ready
  lessons:
  - capstone-concepts
  - tensors-and-strides
  - tiled-matmul
  - softmax-and-sampling
  - boss-capstone-heist
