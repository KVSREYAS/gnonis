id: cpp-systems
title: C++ for Systems & Performance
description: 'Intermediate C++ taught by building one game, Slime Siege, a 2D top-down game engine. Each
  module adds a feature (entities, resource handles, the spawner, inventory, a particle system, background
  loading, a job system, an NPC brain) and teaches the C++ that feature needs: classes, RAII and move
  semantics, smart pointers, templates, the STL, memory layout, data-oriented design, undefined behaviour,
  concurrency, SIMD and profiling. Every concept comes with the careless version, what breaks, the fix,
  and a worked example.'
order: 3
cover: tower
prerequisites: []
tagline: Build a game engine, one C++ feature at a time.
level: intermediate
category: cs
