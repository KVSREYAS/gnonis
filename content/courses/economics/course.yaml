id: economics
title: Economics
description: 'How markets set prices, why firms charge what they do, why trade helps both sides, when
  markets fail, and how central banks steer inflation. Built around games: run a lemonade stand, clear
  markets, fish a shared lake, buy used cars blind and chair the central bank.'
order: 10
cover: hills
prerequisites: []
tagline: Play the market, then understand it.
level: intro
category: economics
lessons:
