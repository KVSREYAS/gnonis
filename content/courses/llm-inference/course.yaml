id: llm-inference
title: LLM Inference
description: Learn what actually happens when a large language model answers a
  prompt, and why serving it fast is a memory problem first. Tokens, attention,
  the KV cache, GPU memory and the roofline, then batching, paging, quantization
  and the systems that tie it together.
order: 1
cover: skyline
prerequisites: []
tagline: From one token to a serving fleet.
level: intermediate
lessons:
  - what-is-a-token
  - the-forward-pass
  - logits-to-tokens
  - prefill-and-decode
  - boss-the-forward-pass
  - queries-keys-values
  - causal-masking
  - heads-mha-gqa
  - the-quadratic-bill
  - boss-attention
  - why-cache
  - sizing-the-cache
  - the-memory-budget
  - boss-cache-docks
  - memory-hierarchy
  - arithmetic-intensity
  - the-roofline
  - decode-speed-limit
  - boss-roofline-ridge
  - continuous-batching
  - batch-size-vs-latency
  - chunked-prefill
  - boss-batch-boulevard
  - kv-as-virtual-memory
  - block-tables-and-copy-on-write
  - preemption-and-swapping
  - boss-paged-pier
  - fewer-bytes-faster-tokens
  - scales-and-groups
  - activation-outliers-smoothquant
  - kv-cache-quantization
  - boss-quant-quarter
  - the-hbm-bottleneck
  - online-softmax
  - tiling-in-sram
  - boss-flash-gardens
  - draft-and-verify
  - acceptance-and-speedup
  - medusa-eagle-and-lookup
  - boss-draft-row
  - tensor-parallelism
  - pipeline-parallelism
  - moe-and-expert-parallelism
  - boss-shard-city
  - ttft-tpot-and-prefix-caching
