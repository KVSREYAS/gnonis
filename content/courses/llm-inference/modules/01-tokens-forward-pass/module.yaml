title: Tokens and the forward pass
district: Token Flats
summary: >-
  Text becomes token ids, ids flow through a stack of transformer blocks, and out comes a probability
  for every word piece in the vocabulary. Then we pick one, and do it all again.
tip: "TIP: One forward pass costs roughly 2 FLOPs per parameter per token."
