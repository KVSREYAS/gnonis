title: GPU memory and the roofline
district: Roofline Ridge
summary: >-
  A GPU can do far more math than it can feed with data. Arithmetic intensity and the roofline model
  tell you which wall you are hitting, and why batch-1 decoding is a bandwidth race.
tip: "TIP: Ridge point = peak FLOP/s divided by memory bandwidth."
